<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fe0b0"/>
      <stop offset=".55" stop-color="#2a8cf0"/>
      <stop offset="1" stop-color="#4b46e0"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy=".15" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>
  <!-- rising dust -->
  <g fill="#fff">
    <circle cx="150" cy="402" r="5" opacity=".55"/><circle cx="196" cy="438" r="3.5" opacity=".4"/>
    <circle cx="352" cy="146" r="4" opacity=".6"/><circle cx="388" cy="196" r="3" opacity=".45"/>
    <circle cx="318" cy="112" r="2.5" opacity=".5"/><circle cx="124" cy="352" r="2.5" opacity=".4"/>
  </g>
  <!-- tick ring -->
  <g stroke="#fff" stroke-linecap="round">
    <path d="M118 318 A140 140 0 0 1 394 318" fill="none" stroke-width="16" opacity=".35"/>
    <path d="M226 180.5 A140 140 0 0 1 286 180.5" fill="none" stroke-width="16"/>
  </g>
  <!-- needle -->
  <line x1="256" y1="318" x2="270" y2="222" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="318" r="24" fill="#fff"/>
</svg>
