<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guitar Tuner</title>
<meta name="theme-color" content="#2a1611">
<meta name="description" content="Offline guitar tuner with automatic string detection, standard tuning.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tuner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, precise instrument
   IDEA: a pedal tuner on a rosewood fretboard
   PICTURE: big arc gauge with needle + six strings with the active one lit
   COLOUR/TYPE: rosewood ground, bone ink, mint for in-tune, coral for off
   LAYOUT: note + gauge, strings row, controls */
:root{color-scheme:dark;--bg:#2a1611;--bg2:#3a1f17;--ink:#f3ead8;--dim:#bfa995;--ok:#5fe0b0;--off:#ff7a59;--line:#5a3628}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
h1{font:800 32px/1.05 "Sofia Sans Condensed","Arial Narrow",system-ui,sans-serif;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 18px;font-size:15px}
.wrap{width:100%;max-width:520px}
.gauge{position:relative;width:100%;aspect-ratio:400/240}
.gauge svg{position:absolute;inset:0;width:100%;height:100%}
.note{text-align:center;margin-top:-4px}
.note b{font:800 clamp(56px,18vw,96px)/1 "Sofia Sans Condensed","Arial Narrow",system-ui,sans-serif;display:block;transition:color .2s}
.note span{color:var(--dim);font-size:15px;white-space:nowrap}
.status{text-align:center;font-weight:600;min-height:26px;margin:6px 0 18px;font-size:17px}
.strings{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px}
.s{min-height:64px;border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:var(--ink);font:600 15px "Instrument Sans",system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .15s,border-color .15s}
.s small{color:var(--dim);font-weight:400;font-size:13px}
.s.on{border-color:var(--ink);background:#ffffff1a}
.s.tuned{border-color:var(--ok);background:#5fe0b022}
.s:focus-visible,button:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.main{flex:1 1 200px;min-height:52px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:800 20px "Sofia Sans Condensed","Arial Narrow",system-ui,sans-serif;cursor:pointer}
button.ghost{flex:1 1 140px;min-height:52px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:600 15px "Instrument Sans",system-ui,sans-serif;cursor:pointer}
button.ghost[aria-pressed=true]{border-color:var(--ok);color:var(--ok)}
.hint{color:var(--dim);font-size:14px;margin-top:16px}
.err{color:var(--off)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){#needle{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Guitar tuner</h1>
  <p class="sub">Standard tuning · E A D G B E · A4 = 440 Hz</p>

  <div class="gauge">
    <svg viewBox="0 0 400 240" aria-hidden="true">
      <defs>
        <linearGradient id="arc" x1="0" x2="1">
          <stop offset="0" stop-color="#ff7a59"/><stop offset=".42" stop-color="#e9c46a"/>
          <stop offset=".5" stop-color="#5fe0b0"/><stop offset=".58" stop-color="#e9c46a"/>
          <stop offset="1" stop-color="#ff7a59"/>
        </linearGradient>
      </defs>
      <path d="M40 200 A160 160 0 0 1 360 200" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round" opacity=".9"/>
      <g id="ticks"></g>
      <text x="40" y="232" fill="#bfa995" font-size="13" text-anchor="middle">−50</text>
      <text x="200" y="22" fill="#bfa995" font-size="13" text-anchor="middle">0</text>
      <text x="360" y="232" fill="#bfa995" font-size="13" text-anchor="middle">+50</text>
      <g id="needle" style="transform-origin:200px 200px;transition:transform .12s ease-out">
        <line x1="200" y1="200" x2="200" y2="52" stroke="#f3ead8" stroke-width="4" stroke-linecap="round"/>
      </g>
      <circle cx="200" cy="200" r="10" fill="#f3ead8"/>
    </svg>
  </div>
  <div class="note"><b id="note">–</b><span id="freq">Pluck a string</span></div>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="strings" id="strings"></div>

  <div class="row">
    <button class="ghost" id="auto" aria-pressed="true">Auto-detect: on</button>
    <button class="main" id="retry" hidden>Retry</button>
  </div>
  <p class="hint">Auto mode picks the nearest string from what you play. Tap a string to lock onto it instead (handy when a string is far out of tune). Install it from your browser’s Share menu (“Add to Home Screen”) to use it offline.</p>
</div>

<script>
{
const STR=[{n:'E',o:2,f:82.41},{n:'A',o:2,f:110.00},{n:'D',o:3,f:146.83},{n:'G',o:3,f:196.00},{n:'B',o:3,f:246.94},{n:'E',o:4,f:329.63}];
const $=id=>document.getElementById(id);
const strEl=$('strings'),needle=$('needle'),noteEl=$('note'),freqEl=$('freq'),statusEl=$('status'),retryBtn=$('retry'),autoBtn=$('auto');
let ctx=null,stream=null,worker=null,wake=null,running=false,starting=false,gen=0;
let auto=true,cur=-1,cand=-1,candN=0,tuned=new Set(),dispC=null,lastMsg=0,lastHeard=0,idleShown=true;

$('ticks').innerHTML=Array.from({length:11},(_,i)=>{const a=(-90+i*18)*Math.PI/180,r1=i%5?150:144,r2=168;
  return `<line x1="${200+r1*Math.sin(a)}" y1="${200-r1*Math.cos(a)}" x2="${200+r2*Math.sin(a)}" y2="${200-r2*Math.cos(a)}" stroke="#bfa995" stroke-width="${i%5?1.5:2.5}"/>`}).join('');

let lastKey='';
function renderStrings(force){const k=cur+'|'+auto+'|'+[...tuned].join(',');if(!force&&k===lastKey)return;lastKey=k;
  strEl.innerHTML=STR.map((s,i)=>`<button class="s${i===cur?' on':''}${tuned.has(i)?' tuned':''}" data-i="${i}" aria-label="String ${6-i}, ${s.n}${s.o}">${s.n}<small>${6-i} · ${s.n}${s.o}</small></button>`).join('')}
strEl.addEventListener('click',e=>{const b=e.target.closest('.s');if(!b)return;
  const i=+b.dataset.i;if(!auto&&cur===i){setAuto(true);return}cur=i;dispC=null;setAuto(false)});
function setAuto(v){auto=v;autoBtn.setAttribute('aria-pressed',v);autoBtn.textContent='Auto-detect: '+(v?'on':'off');renderStrings()}
autoBtn.addEventListener('click',()=>setAuto(!auto));

const cents=(f,ref)=>1200*Math.log2(f/ref);
function nearest(f){let bi=0,bd=1e9;STR.forEach((s,i)=>{const d=Math.abs(cents(f,s.f));if(d<bd){bd=d;bi=i}});return bi}
function say(text,color){statusEl.textContent=text;statusEl.style.color=color||'var(--dim)'}

function idle(){ // no trusted reading: never leave an old value on screen
  idleShown=true;dispC=null;needle.style.transform='rotate(0deg)';needle.style.opacity='.3';
  noteEl.style.color='var(--dim)';freqEl.textContent='Pluck a string';say('Listening…')}
function fail(msg){ // something broke: say what, offer Retry
  teardown();idle();noteEl.textContent='–';freqEl.textContent='';say(msg,'var(--off)');retryBtn.hidden=false}

// One trusted pitch from the worker. Only drawing happens here.
function onPitch(f){
  lastHeard=performance.now();
  if(auto){const n=nearest(f);
    if(cur<0)cur=n;
    else if(n!==cur){if(n===cand)candN++;else{cand=n;candN=1}
      if(candN>=4){cur=n;candN=0;dispC=null}else return} // undecided: hold, never measure against the wrong string
    else candN=0}
  if(cur<0)return;
  idleShown=false;needle.style.opacity='1';
  const s=STR[cur];let c=cents(f,s.f);
  dispC=dispC==null?c:dispC+(c-dispC)*0.35;c=dispC;
  needle.style.transform=`rotate(${Math.max(-50,Math.min(50,c))*1.8}deg)`;
  noteEl.textContent=s.n;
  freqEl.textContent=`${f.toFixed(1)} Hz · target ${s.f.toFixed(2)} Hz · ${c>=0?'+':''}${c.toFixed(0)} ¢`;
  const ok=Math.abs(c)<=5;
  noteEl.style.color=ok?'var(--ok)':Math.abs(c)<=15?'#e9c46a':'var(--off)';
  if(ok){say('In tune ✓','var(--ok)');tuned.add(cur)}
  else say(c<0?`Too low — tighten (${Math.abs(c).toFixed(0)} ¢ flat)`:`Too high — loosen (${c.toFixed(0)} ¢ sharp)`,'var(--off)');
  renderStrings();
}

// Watchdog: stale readings fade out; if audio stops arriving, say so and offer Retry.
setInterval(()=>{
  if(!running)return;const now=performance.now();
  if(ctx&&ctx.state==='suspended'){lastMsg=now;say('Tap anywhere to start listening');return}
  if(now-lastMsg>1000){fail('The mic stopped sending sound.');return}
  if(!idleShown&&now-lastHeard>1500)idle();
  else if(!idleShown&&now-lastHeard>500)needle.style.opacity='.3'; // dim while unsure
},250);

async function start(){
  if(starting||running)return;starting=true;const my=++gen;
  retryBtn.hidden=true;say('Starting the mic…');
  try{
    if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw new Error('Open the tuner over https to use the mic.');
    if(!window.AudioWorkletNode)throw new Error('This browser is too old for the tuner.');
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    ctx.resume().catch(()=>{});
    worker=worker||new Worker('tuner-worker.js');
    const [s]=await Promise.all([
      navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}),
      ctx.audioWorklet.addModule('tuner-worklet.js')]);
    if(my!==gen){s.getTracks().forEach(t=>t.stop());return}
    stream=s;stream.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>running&&fail('The mic was turned off.')));
    const src=ctx.createMediaStreamSource(stream);
    const hp=new BiquadFilterNode(ctx,{type:'highpass',frequency:60});
    const hop=Math.round(ctx.sampleRate/60);
    const tap=new AudioWorkletNode(ctx,'tuner-tap',{numberOfInputs:1,numberOfOutputs:1,channelCount:1,channelCountMode:'explicit',processorOptions:{hop}});
    const mute=new GainNode(ctx,{gain:0});
    src.connect(hp).connect(tap).connect(mute).connect(ctx.destination); // silent output keeps the graph running
    // Audio thread → worker directly; the UI thread only receives results.
    const ch=new MessageChannel();
    tap.port.postMessage({port:ch.port1},[ch.port1]);
    worker.postMessage({t:'init',sr:ctx.sampleRate,port:ch.port2},[ch.port2]);
    worker.onmessage=e=>{lastMsg=performance.now();if(e.data.t==='pitch')onPitch(e.data.f)};
    lastMsg=performance.now();running=true;idle();
    ctx.onstatechange=()=>{if(running&&ctx&&ctx.state==='running')idle()};
    if(ctx.state!=='running'){say('Tap anywhere to start listening');ctx.resume().catch(()=>{})} // Safari lets an active mic start audio without a tap
    try{wake=await navigator.wakeLock?.request('screen')}catch{} // keep the screen on while tuning
  }catch(e){
    const m=e&&e.name==='NotAllowedError'?'Mic access was blocked. Allow it in your browser settings, then Retry.'
      :e&&e.name==='NotFoundError'?'No microphone found.':'Could not start the mic: '+(e&&e.message||e);
    fail(m);
  }finally{starting=false}
}
function teardown(){
  gen++;running=false;stream?.getTracks().forEach(t=>t.stop());stream=null;
  ctx?.close().catch(()=>{});ctx=null;wake?.release?.().catch(()=>{});wake=null}

// Browsers may hold audio until the first tap; any tap on the page resumes it.
document.addEventListener('pointerdown',()=>{if(ctx&&ctx.state==='suspended')ctx.resume().then(()=>running&&idle()).catch(()=>{})});
retryBtn.addEventListener('click',()=>{teardown();start()});
// Release the mic in the background; pick it up again on return.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(running||starting)teardown()}
  else if(!running&&!starting&&retryBtn.hidden)start()});
if('serviceWorker' in navigator&&isSecureContext)navigator.serviceWorker.register('./sw.js').catch(()=>{});
renderStrings(true);
start();
}
</script>
</body>
</html>
