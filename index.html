<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guitar Tuner</title>
<meta name="description" content="Offline guitar tuner with automatic string detection, standard tuning.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05060c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tuner">
<style>
/* VOICE: calm instrument under a night sky; precise, never busy
   IDEA: a tuner floating on the Milky Way, dust rising as strings ring
   PICTURE: tick ring + deviation arc + springy needle, rising light dust behind
   COLOUR/TYPE: ink-night or warm paper (follows the system); mint = in tune, amber = close, coral = off; system rounded font
   LAYOUT: top bar, gauge, note readout, string pegs; one column, thumb-reachable */
:root{
  --bg:#f6f5f1;--glow:#ffffff;--ink:#15161f;--dim:#6c6f82;--faint:#a9abb9;--line:#dedcd5;--chip:#ffffffb3;--chipline:#e6e3dc;
  --ok:#0fa673;--warn:#c88a10;--off:#e0533d;--needle:#15161f;
  --dust-a:#b58a3c;--dust-b:#7d84a6;--dust-ok:#14b07c;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#05060c;--glow:#161c3d;--ink:#eef0ff;--dim:#8d92ad;--faint:#4b5070;--line:#22263d;--chip:#ffffff0d;--chipline:#ffffff17;
  --ok:#5fe6b6;--warn:#f4c766;--off:#ff7b6b;--needle:#f4f5ff;
  --dust-a:#fff2dc;--dust-b:#b6ceff;--dust-ok:#7dffd4;
}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,var(--glow),var(--bg) 70%) fixed,var(--bg);color:var(--ink);
  font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:clip}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) max(20px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 20px) max(20px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13px;margin:1px 0 0}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px 0 14px;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.switch i{position:relative;width:44px;height:26px;border-radius:13px;background:var(--line);transition:background .25s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .25s cubic-bezier(.3,1.4,.6,1)}
.switch[aria-checked=true] i{background:var(--ok)}
.switch[aria-checked=true] i::after{transform:translateX(18px)}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0}
.gauge{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:400/228}
.gauge svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tick{stroke:var(--faint);stroke-linecap:round}
.tick.major{stroke:var(--dim)}
.tick.zero{stroke:var(--ok)}
.track{stroke:var(--line)}
.zone{stroke:var(--ok);opacity:.28}
#dev{transition:stroke .3s}
#needle line{stroke:var(--needle)}
#needle,#dev{transition:opacity .4s}
.gauge.idle #needle{opacity:.28}.gauge.idle #dev{opacity:0}
.flatsharp{fill:var(--dim);font-size:20px;font-weight:600}
.hub{fill:var(--bg);stroke:var(--needle);stroke-width:3}

.readout{text-align:center;margin-top:-6px;position:relative}
.note{font-size:clamp(84px,27vw,120px);font-weight:700;line-height:1;letter-spacing:-.03em;display:inline-flex;align-items:flex-start;transition:color .3s,text-shadow .3s}
.note sub{font-size:.26em;font-weight:600;color:var(--dim);margin:.62em 0 0 .06em;vertical-align:baseline}
.readout.ok .note{color:var(--ok);text-shadow:0 0 28px color-mix(in srgb,var(--ok) 45%,transparent)}
.readout.ok::before{content:"";position:absolute;left:50%;top:44px;width:150px;height:150px;margin-left:-75px;border-radius:50%;
  border:2px solid var(--ok);opacity:0;animation:ring 1.1s ease-out 1;pointer-events:none}
@keyframes ring{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.35);opacity:0}}
.cents{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;height:30px;color:var(--dim);transition:color .3s}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:34px;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:600;
  background:var(--chip);border:1px solid var(--chipline);color:var(--dim);transition:color .3s,background .3s,border-color .3s;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.off{color:var(--off);border-color:color-mix(in srgb,var(--off) 35%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.hz{font-size:13px;color:var(--faint);margin-top:8px;font-variant-numeric:tabular-nums;min-height:19px}
.retry{margin-top:12px;min-height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}

.pegs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:10px;border-radius:24px;
  background:var(--chip);border:1px solid var(--chipline);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.peg{position:relative;aspect-ratio:1;max-height:64px;border-radius:18px;border:1px solid transparent;background:none;color:var(--ink);font:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .15s}
.peg:active{transform:scale(.94)}
.peg b{font-size:20px;line-height:1}
.peg small{font-size:11px;color:var(--dim);margin-top:3px}
.peg.on{background:var(--ink);color:var(--bg)}.peg.on small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.peg.tuned::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hint{color:var(--dim);font-size:13px;text-align:center;margin:12px 0 0}
button:focus-visible{outline:2px solid var(--ok);outline-offset:3px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div><h1>Tuner</h1><p class="sub">Standard · E A D G B E · 440 Hz</p></div>
    <button class="switch" id="auto" role="switch" aria-checked="true">Auto<i></i></button>
  </header>

  <main class="stage">
    <div class="gauge idle" id="gauge">
      <svg viewBox="0 0 400 228" aria-hidden="true">
        <path class="track" d="M50 210 A150 150 0 0 1 350 210" fill="none" stroke-width="6" stroke-linecap="round"/>
        <path class="zone" id="zone" fill="none" stroke-width="6"/>
        <path id="dev" fill="none" stroke-width="6" stroke-linecap="round"/>
        <g id="ticks"></g>
        <text class="flatsharp" x="62" y="238" text-anchor="middle">♭</text>
        <text class="flatsharp" x="338" y="238" text-anchor="middle">♯</text>
        <g id="needle">
          <line x1="200" y1="210" x2="200" y2="44" stroke-width="3.5" stroke-linecap="round"/>
          <circle class="hub" cx="200" cy="210" r="8"/>
        </g>
      </svg>
    </div>

    <div class="readout" id="readout">
      <div class="note" id="note">–</div>
      <div class="cents" id="cents"></div>
      <div><span class="pill" id="status" aria-live="polite">Starting the mic…</span></div>
      <div class="hz" id="hz"></div>
      <button class="retry" id="retry" hidden>Retry</button>
    </div>
  </main>

  <nav class="pegs" id="strings" aria-label="Strings"></nav>
  <p class="hint">Tap a string to lock it · tap it again for auto</p>
</div>

<script>
{
const STR=[{n:'E',o:2,f:82.41},{n:'A',o:2,f:110.00},{n:'D',o:3,f:146.83},{n:'G',o:3,f:196.00},{n:'B',o:3,f:246.94},{n:'E',o:4,f:329.63}];
const $=id=>document.getElementById(id);
const strEl=$('strings'),needle=$('needle'),dev=$('dev'),gauge=$('gauge'),readout=$('readout'),noteEl=$('note'),centsEl=$('cents'),
      hzEl=$('hz'),statusEl=$('status'),retryBtn=$('retry'),autoBtn=$('auto');
let ctx=null,stream=null,worker=null,wake=null,running=false,starting=false,gen=0;
let auto=true,cur=-1,cand=-1,candN=0,tuned=new Set(),dispC=null,lastMsg=0,lastHeard=0,idleShown=true,tuneState='idle';
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');

// ---------- gauge geometry: ±50 cents across a 180° arc ----------
const CX=200,CY=210,R=150;
const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)]};
const arc=(d0,d1,r)=>{const [x0,y0]=pt(d0,r),[x1,y1]=pt(d1,r);return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 ${d1>d0?1:0} ${x1.toFixed(2)} ${y1.toFixed(2)}`};
$('ticks').innerHTML=Array.from({length:41},(_,i)=>{const c=-50+i*2.5,deg=c*1.8,major=i%4===0,zero=c===0;
  const [x0,y0]=pt(deg,R+12),[x1,y1]=pt(deg,R+(zero?34:major?26:19));
  return `<line class="tick${major?' major':''}${zero?' zero':''}" x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke-width="${zero?3.5:major?2.5:1.6}"/>`}).join('');
$('zone').setAttribute('d',arc(-9,9,R));

// Needle + deviation arc follow the reading with a spring, on the display's own frame clock.
let shown=0,vel=0,target=0,anim=0,lastT=0;
function draw(c){const deg=Math.max(-50,Math.min(50,c))*1.8;
  needle.style.transform=`rotate(${deg}deg)`;needle.style.transformOrigin=`${CX}px ${CY}px`;
  dev.setAttribute('d',Math.abs(deg)<0.4?'':arc(0,deg,R))}
function tick(t){const dt=Math.min(.05,(t-lastT)/1000||.016);lastT=t;
  const k=170,damp=2*Math.sqrt(k)*.82;vel+=(k*(target-shown)-damp*vel)*dt;shown+=vel*dt;draw(shown);
  anim=Math.abs(target-shown)>.05||Math.abs(vel)>.05?requestAnimationFrame(tick):0}
function setTarget(c){target=c;if(reduceMotion.matches){shown=c;vel=0;draw(c);return}if(!anim){lastT=performance.now();anim=requestAnimationFrame(tick)}}

// ---------- strings ----------
let lastKey='';
function renderStrings(force){const k=cur+'|'+auto+'|'+[...tuned].join(',');if(!force&&k===lastKey)return;lastKey=k;
  strEl.innerHTML=STR.map((s,i)=>`<button class="peg${i===cur?' on':''}${tuned.has(i)?' tuned':''}" data-i="${i}" aria-pressed="${i===cur&&!auto}" aria-label="String ${6-i}, ${s.n}${s.o}${tuned.has(i)?', tuned':''}"><b>${s.n}</b><small>${6-i}</small></button>`).join('')}
strEl.addEventListener('click',e=>{const b=e.target.closest('.peg');if(!b)return;
  const i=+b.dataset.i;if(!auto&&cur===i){setAuto(true);return}cur=i;dispC=null;setAuto(false);showNote()});
function setAuto(v){auto=v;autoBtn.setAttribute('aria-checked',v);renderStrings()}
autoBtn.addEventListener('click',()=>setAuto(!auto));
function showNote(){const s=STR[cur];noteEl.innerHTML=s?`${s.n}<sub>${s.o}</sub>`:'–'}

// ---------- visuals: rising dust, drawn off the main thread when possible ----------
const dustEl=$('dust');let fx=null,fxQueue=[];
function fxCall(t,...a){if(!fx){fxQueue.push([t,a]);if(fxQueue.length>20)fxQueue.shift();return}
  if(fx instanceof Worker)fx.postMessage({t,a});else fx[t]?.(...a)}
function dustColors(){const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue(n).trim();
  return {mode:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',a:v('--dust-a'),b:v('--dust-b'),ok:v('--dust-ok')}}
function dustSize(){return [innerWidth,innerHeight,Math.min(2,devicePixelRatio||1)]}
function initFx(){
  const [w,h,dpr]=dustSize(),colors=dustColors(),reduced=reduceMotion.matches;
  const ready=f=>{fx=f;for(const [t,a] of fxQueue.splice(0))fxCall(t,...a)};
  try{if(dustEl.transferControlToOffscreen&&window.Worker){
    const off=dustEl.transferControlToOffscreen(),wk=new Worker('fx.js');
    wk.postMessage({t:'init',canvas:off,w,h,dpr,colors,reduced},[off]);window.__fxMode='worker';ready(wk);return}}catch{}
  const s=document.createElement('script');s.src='fx.js';
  s.onload=()=>{const f=window.createDust(dustEl);f.theme(colors);f.resize(w,h,dpr);f.reduced(reduced);f.start();window.__fxMode='main';ready(f)};
  document.head.appendChild(s)}
addEventListener('resize',()=>fxCall('resize',...dustSize()));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>fxCall('theme',dustColors()));
reduceMotion.addEventListener('change',()=>{fxCall('reduced',reduceMotion.matches);if(!reduceMotion.matches)fxCall('start')});
function setTune(s){if(s!==tuneState){tuneState=s;fxCall('tune',s)}}

// ---------- readings ----------
const cents=(f,ref)=>1200*Math.log2(f/ref);
function nearest(f){let bi=0,bd=1e9;STR.forEach((s,i)=>{const d=Math.abs(cents(f,s.f));if(d<bd){bd=d;bi=i}});return bi}
function say(text,cls){statusEl.textContent=text;statusEl.className='pill'+(cls?' '+cls:'')}

function idle(){ // no trusted reading: never leave an old value on screen
  idleShown=true;dispC=null;setTarget(0);gauge.classList.add('idle');readout.classList.remove('ok');
  noteEl.style.color='';centsEl.textContent='';hzEl.textContent='';say('Listening…');setTune('idle')}
function fail(msg){teardown();idle();noteEl.textContent='–';say(msg,'off');retryBtn.hidden=false}

function onPitch(f){
  lastHeard=performance.now();
  if(auto){const n=nearest(f);
    if(cur<0)cur=n;
    else if(n!==cur){if(n===cand)candN++;else{cand=n;candN=1}
      if(candN>=4){cur=n;candN=0;dispC=null}else return} // undecided: hold, never measure against the wrong string
    else candN=0}
  if(cur<0)return;
  idleShown=false;gauge.classList.remove('idle');
  const s=STR[cur];let c=cents(f,s.f);
  dispC=dispC==null?c:dispC+(c-dispC)*0.35;c=dispC;
  setTarget(c);showNote();
  const a=Math.abs(c),ok=a<=5;
  centsEl.textContent=(c>=0?'+':'−')+Math.abs(c).toFixed(0)+' ¢';
  centsEl.style.color=ok?'var(--ok)':a<=15?'var(--warn)':'var(--off)';
  dev.style.stroke=ok?'var(--ok)':a<=15?'var(--warn)':'var(--off)';
  hzEl.textContent=`${f.toFixed(1)} Hz · target ${s.f.toFixed(2)} Hz`;
  if(ok){if(!readout.classList.contains('ok')){readout.classList.remove('ok');void readout.offsetWidth;readout.classList.add('ok')}
    say('In tune','ok');setTune('ok');if(!tuned.has(cur)){tuned.add(cur);fxCall('celebrate')}}
  else{readout.classList.remove('ok');say(c<0?'Tighten ↑':'Loosen ↓',a<=15?'warn':'off');setTune('off')}
  renderStrings();
}

// Watchdog: stale readings fade out; if audio stops arriving, say so and offer Retry.
setInterval(()=>{
  if(!running)return;const now=performance.now();
  if(ctx&&ctx.state==='suspended'){lastMsg=now;say('Tap anywhere to start listening');return}
  if(now-lastMsg>1000){fail('The mic stopped sending sound');return}
  if(!idleShown&&now-lastHeard>1500)idle();
  else if(!idleShown&&now-lastHeard>500)gauge.classList.add('idle'); // dim while unsure
},250);

// ---------- audio: AudioWorklet (audio thread) → Worker (detection) → this thread (drawing only) ----------
async function start(){
  if(starting||running)return;starting=true;const my=++gen;
  retryBtn.hidden=true;say('Starting the mic…');
  try{
    if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw new Error('Open the tuner over https to use the mic.');
    if(!window.AudioWorkletNode)throw new Error('This browser is too old for the tuner.');
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    ctx.resume().catch(()=>{});
    worker=worker||new Worker('tuner-worker.js');
    const [s]=await Promise.all([
      navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}),
      ctx.audioWorklet.addModule('tuner-worklet.js')]);
    if(my!==gen){s.getTracks().forEach(t=>t.stop());return}
    stream=s;stream.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>running&&fail('The mic was turned off')));
    const src=ctx.createMediaStreamSource(stream);
    const hp=new BiquadFilterNode(ctx,{type:'highpass',frequency:60});
    const hop=Math.round(ctx.sampleRate/60);
    const tap=new AudioWorkletNode(ctx,'tuner-tap',{numberOfInputs:1,numberOfOutputs:1,channelCount:1,channelCountMode:'explicit',processorOptions:{hop}});
    const mute=new GainNode(ctx,{gain:0});
    src.connect(hp).connect(tap).connect(mute).connect(ctx.destination); // silent output keeps the graph running
    const ch=new MessageChannel();
    tap.port.postMessage({port:ch.port1},[ch.port1]);
    worker.postMessage({t:'init',sr:ctx.sampleRate,port:ch.port2},[ch.port2]);
    worker.onmessage=e=>{const m=e.data;lastMsg=performance.now();fxCall('level',m.r,m.a);if(m.t==='pitch')onPitch(m.f)};
    lastMsg=performance.now();running=true;idle();
    ctx.onstatechange=()=>{if(running&&ctx&&ctx.state==='running')idle()};
    if(ctx.state!=='running'){say('Tap anywhere to start listening');ctx.resume().catch(()=>{})} // Safari lets an active mic start audio without a tap
    try{wake=await navigator.wakeLock?.request('screen')}catch{} // keep the screen on while tuning
  }catch(e){
    const m=e&&e.name==='NotAllowedError'?'Mic access is blocked — allow it in settings, then Retry'
      :e&&e.name==='NotFoundError'?'No microphone found':'Could not start the mic: '+(e&&e.message||e);
    fail(m);
  }finally{starting=false}
}
function teardown(){
  gen++;running=false;stream?.getTracks().forEach(t=>t.stop());stream=null;
  ctx?.close().catch(()=>{});ctx=null;wake?.release?.().catch(()=>{});wake=null}

// Browsers may hold audio until the first tap; any tap on the page resumes it.
document.addEventListener('pointerdown',()=>{if(ctx&&ctx.state==='suspended')ctx.resume().then(()=>running&&idle()).catch(()=>{})});
retryBtn.addEventListener('click',()=>{teardown();start()});
// Release the mic and pause the dust in the background; pick both up again on return.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){fxCall('pause');if(running||starting)teardown()}
  else{fxCall('start');if(!running&&!starting&&retryBtn.hidden)start()}});

if('serviceWorker' in navigator&&isSecureContext){
  // Updates: check whenever the app comes to the foreground (iOS resumes home-screen apps instead
  // of reloading them), and reload once when a new version takes over.
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{});
}
renderStrings(true);draw(0);initFx();start();
}
</script>
</body>
</html>
